<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Crowd Eyes — web adaptation. Hold Space to open the eyes."
    />
    <title>Crowd Eyes</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app" id="app" tabindex="0" aria-label="Hold Space to open the eyes">
      <p id="status" class="visually-hidden" role="status">Loading…</p>

      <div class="stage-wrap">
        <!-- Eyes under the A4 drawing; sockets are transparent cutouts -->
        <div class="stage" id="stage" data-open="false">
          <div id="eyes" class="eyes" aria-hidden="true"></div>
          <img
            class="drawing"
            src="assets/drawing.png"
            alt="Crowd of figures"
            draggable="false"
          />
          <div id="debugOverlay" class="debug-overlay" hidden aria-hidden="true"></div>
        </div>
      </div>

      <p class="hint" id="hint">Hold Space</p>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
